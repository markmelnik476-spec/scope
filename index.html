                color: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                subtopics: [
                    { text: 'Выбор', angle: 0, distance: 70 },
                    { text: 'Душа', angle: 72, distance: 75 },
                    { text: 'Миссия', angle: 144, distance: 70 },
                    { text: 'Путь', angle: 216, distance: 75 },
                    { text: 'Смысл', angle: 288, distance: 70 }
                ],
                details: [

                    { text: 'Задача', angle: 108, distance: 105 },
                    { text: 'Карма', angle: 180, distance: 100 },
                    { text: 'Рок', angle: 252, distance: 105 },
                    { text: 'Судьба', angle: 324, distance: 100 }
                ]
            }
        ];
        
        function App() {
            const [zoom, setZoom] = useState(0.5);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [lastMousePos, setLastMousePos] = useState({ x: 0, y: 0 });
            const [selectedTerm, setSelectedTerm] = useState(null);
            const [hoveredTerm, setHoveredTerm] = useState(null);
            const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });
            const [searchQuery, setSearchQuery] = useState('');
            const viewportRef = useRef(null);
            
            const handleWheel = useCallback((e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                setZoom(prev => Math.max(0.3, Math.min(4, prev + delta)));
            }, []);
            
            const handleMouseDown = useCallback((e) => {
                if (e.target.classList.contains('subtopic') || e.target.classList.contains('detail')) {
                    return;
                }
                setIsDragging(true);
                setLastMousePos({ x: e.clientX, y: e.clientY });
            }, []);
            
            const handleMouseMove = useCallback((e) => {
                if (!isDragging) return;
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                setPan(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                setLastMousePos({ x: e.clientX, y: e.clientY });
            }, [isDragging, lastMousePos]);
            
            const handleMouseUp = useCallback(() => {
                setIsDragging(false);
            }, []);
            
            const zoomIn = () => setZoom(prev => Math.min(4, prev + 0.2));
            const zoomOut = () => setZoom(prev => Math.max(0.3, prev - 0.2));
            const resetView = () => {
                setZoom(0.5);
                setPan({ x: 0, y: 0 });
            };
            
            const getVisibility = (zoomLevel, threshold) => zoomLevel >= threshold;
            
            const getSubtopicPosition = (cluster, subtopic) => {
                const rad = (subtopic.angle * Math.PI) / 180;
                return {
                    x: cluster.x + Math.cos(rad) * subtopic.distance,
                    y: cluster.y + Math.sin(rad) * subtopic.distance
                };
            };
            
            const getDetailPosition = (cluster, detail) => {
                const rad = (detail.angle * Math.PI) / 180;
                return {
                    x: cluster.x + Math.cos(rad) * detail.distance,
                    y: cluster.y + Math.sin(rad) * detail.distance
                };
            };
            
            const handleTermClick = (term) => {
                setSelectedTerm(term);
            };
            
            const closeModal = () => {
                setSelectedTerm(null);
            };
            
            const handleTermHover = (term, e) => {
                setHoveredTerm(term);
                setTooltipPos({ x: e.clientX, y: e.clientY });
            };
            
            const handleTermLeave = () => {
                setHoveredTerm(null);
            };
            
            // Фильтрация кластеров по поиску
            const filteredClusters = clustersData.filter(cluster => {
                if (!searchQuery) return true;
                const query = searchQuery.toLowerCase();
                return cluster.title.toLowerCase().includes(query) ||
                    cluster.subtopics.some(s => s.text.toLowerCase().includes(query)) ||
                    cluster.details.some(d => d.text.toLowerCase().includes(query));
            });
            
            useEffect(() => {
                const viewport = viewportRef.current;
                if (viewport) {
                    viewport.addEventListener('wheel', handleWheel, { passive: false });
                    return () => viewport.removeEventListener('wheel', handleWheel);
                }
            }, [handleWheel]);
            
            // Обработка клавиши Escape для закрытия модального окна
            useEffect(() => {
                const handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                    }
                };
                window.addEventListener('keydown', handleEscape);
                return () => window.removeEventListener('keydown', handleEscape);
            }, []);
            
            return (
                <div
                    ref={viewportRef}
                    className={`viewport ${isDragging ? 'dragging' : ''}`}
                    onMouseDown={handleMouseDown}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                >
                    <div
                        className="canvas"
                        style={{
                            transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                            width: '2000px',
                            height: '2000px',
                            left: '50%',
                            top: '50%',
                            marginLeft: '-1000px',
                            marginTop: '-1000px'
                        }}
                    >
                        <div
                            className={`center-title ${getVisibility(zoom, 0.4) ? 'visible' : ''}`}
                            style={{
                                left: '50%',
                                top: '50%',
                                transform: 'translate(-50%, -50%)',
                                color: '#fff'
                            }}
                        >
                            ВЕЛИКОЕ<br/>ПРОБУЖДЕНИЕ
                        </div>
                        
                        {filteredClusters.map(cluster => (
                            <React.Fragment key={cluster.id}>
                                <div
                                    className="cluster"
                                    style={{
                                        left: '50%',
                                        top: '50%',
                                        width: `${cluster.radius * 2}px`,
                                        height: `${cluster.radius * 2}px`,
                                        marginLeft: `${cluster.x - cluster.radius}px`,
                                        marginTop: `${cluster.y - cluster.radius}px`,
                                        background: cluster.color,
                                        opacity: getVisibility(zoom, 0.3) ? 1 : 0.7,
                                        transform: `scale(${zoom >= 0.5 ? 1 : 0.9})`
                                    }}
                                >
                                    <div
                                        className="cluster-title"
                                        style={{
                                            fontSize: `${Math.max(9, 12 * Math.min(1, zoom))}px`,
                                            whiteSpace: 'pre-line'
                                        }}
                                    >
                                        {cluster.title}
                                    </div>
                                </div>
                                
                                {cluster.subtopics.map((subtopic, idx) => {
                                    const pos = getSubtopicPosition(cluster, subtopic);
                                    const visible = getVisibility(zoom, 0.7);
                                    const hasDefinition = termDefinitions[subtopic.text];
                                    return (
                                        <div
                                            key={idx}
                                            className={`subtopic ${visible ? 'visible' : ''}`}
                                            style={{
                                                left: '50%',
                                                top: '50%',
                                                marginLeft: `${pos.x}px`,
                                                marginTop: `${pos.y}px`,
                                                transform: `translate(-50%, -50%) ${visible ? 'scale(1)' : 'scale(0.8)'}`,
                                                opacity: visible ? 1 : 0
                                            }}
                                            onClick={() => hasDefinition && handleTermClick(subtopic.text)}
                                            onMouseEnter={(e) => hasDefinition && handleTermHover(subtopic.text, e)}
                                            onMouseLeave={handleTermLeave}
                                        >
                                            {subtopic.text}
                                        </div>
                                    );
                                })}
                                
                                {cluster.details.map((detail, idx) => {
                                    const pos = getDetailPosition(cluster, detail);
                                    const visible = getVisibility(zoom, 1.3);
                                    const hasDefinition = termDefinitions[detail.text];
                                    return (
                                        <div
                                            key={idx}
                                            className={`detail ${visible ? 'visible' : ''}`}
                                            style={{
                                                left: '50%',
                                                top: '50%',
                                                marginLeft: `${pos.x}px`,
                                                marginTop: `${pos.y}px`,
                                                transform: `translate(-50%, -50%) ${visible ? 'scale(1)' : 'scale(0.7)'}`,
                                                opacity: visible ? 1 : 0
                                            }}
                                            onClick={() => hasDefinition && handleTermClick(detail.text)}
                                            onMouseEnter={(e) => hasDefinition && handleTermHover(detail.text, e)}
                                            onMouseLeave={handleTermLeave}
                                        >
                                            {detail.text}
                                        </div>
                                    );
                                })}
                            </React.Fragment>
                        ))}
                    </div>
                    
                    <div className="controls">
                        <button className="control-btn" onClick={zoomIn}>+</button>
                        <button className="control-btn" onClick={zoomOut}>−</button>
                    </div>
                    
                    <div className="search-container">
                        <input
                            type="text"
                            className="search-input"
                            placeholder="🔍 Поиск терминов..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                        />
                        <button className="reset-btn" onClick={resetView}>Сброс</button>
                    </div>
                    
                    <div className="hint">
                        <strong> Навигация:</strong><br/>
                        • Колесико мыши — зум<br/>
                        • Перетаскивание — панорама<br/>
                        • Кнопки +/- — зум<br/>
                        • <strong>Клик на термин</strong> — расшифровка<br/>
                        <br/>
                        <strong> Совет:</strong><br/>
                        Приближайся к кластеру<br/>для просмотра деталей
                    </div>
                    
                    <div className="zoom-level">
                        Зум: {Math.round(zoom * 100)}%
                    </div>
                    
                    <div className="legend">
                        <div className="legend-title">📊 Кластеры ({filteredClusters.length})</div>
                        {filteredClusters.map(cluster => (
                            <div
                                key={cluster.id}
                                className="legend-item"
                                onClick={() => {
                                    setPan({ x: -cluster.x * zoom + window.innerWidth/2, y: -cluster.y * zoom + window.innerHeight/2 });
                                    setZoom(1.2);
                                }}
                            >
                                <div className="legend-color" style={{ background: cluster.color }}></div>
                                <span className="legend-text">{cluster.title.replace(/\n/g, ' ')}</span>
                            </div>
                        ))}
                    </div>
                    
                    {/* Tooltip */}
                    <div
                        className={`tooltip ${hoveredTerm ? 'visible' : ''}`}
                        style={{
                            left: `${tooltipPos.x + 15}px`,
                            top: `${tooltipPos.y + 15}px`
                        }}
                    >
                        {hoveredTerm && (
                            <>
                                <div className="tooltip-title">{hoveredTerm}</div>
                                <div>{termDefinitions[hoveredTerm]?.substring(0, 150)}...</div>
                            </>
                        )}
                    </div>
                    
                    {/* Modal */}
                    <div
                        className={`modal-overlay ${selectedTerm ? 'visible' : ''}`}
                        onClick={closeModal}
                    >
                        <div className="modal" onClick={(e) => e.stopPropagation()}>
                            <div className="modal-header">
                                <div className="modal-title">{selectedTerm}</div>
                                <button className="modal-close" onClick={closeModal}>×</button>
                            </div>
                            <div className="modal-content">
                                <span className="modal-category">Термин инфографики</span>
                                <p>{termDefinitions[selectedTerm] || 'Определение отсутствует'}</p>
                                <p style={{ fontSize: '13px', color: 'rgba(255,255,255,0.6)', marginTop: '20px' }}>
                                    💡 Нажмите вне окна или Esc для закрытия
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
